spring.application.name=tecsoporte

# Puerto del servidor
server.port=${PORT:8080}

# Conexion a la base de datos MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# Configuracion de caracteres UTF-8
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4

# Configuracion JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Origen permitido del frontend
frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}

